name: Docker Publish

on:
 workflow_call:
   

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & Push to Docker Hub the forntend 
        uses: docker/build-push-action@v6
        with:
          context: ./forntend
          file : ./forntend/Dockerfile
          push: true
          tags: |
              ${{ vars.DOCKERHUB_USER }}/bookmyshow-frontend:${{ github.ref_name }}
              ${{ vars.DOCKERHUB_USER }}/bookmyshow-frontend:latest
              ${{ vars.DOCKERHUB_USER }}/bookmyshow-frontend:${{ github.sha }}
      - name: Build & Push to Docker Hub the backend 
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file : ./backend/Dockerfile
          push: true
          tags: |
              ${{ vars.DOCKERHUB_USER }}/bookmyshow-backend:${{ github.ref_name }}
              ${{ vars.DOCKERHUB_USER }}/bookmyshow-backend:latest
              ${{ vars.DOCKERHUB_USER }}/bookmyshow-backend:${{ github.sha }}
      
      - name: Build & Push to Docker Hub the nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USER }}/bookmyshow-nginx:${{ github.ref_name }}
            ${{ vars.DOCKERHUB_USER }}/bookmyshow-nginx:latest
            ${{ vars.DOCKERHUB_USER }}/bookmyshow-nginx:${{ github.sha }}